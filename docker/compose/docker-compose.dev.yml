version: '3.8'

services:
  api:
    build:
      context: ../..
      dockerfile: docker/development/Dockerfile
    container_name: minha_api_node_dev
    ports:
      - "3000:3000"
    volumes:
      - ../../:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=3000
    restart: unless-stopped
